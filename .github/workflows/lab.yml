name: CVE-2025-3115 Lab

on: [push, workflow_dispatch]

jobs:
  run-lab:
    runs-on: ubuntu-latest
    services:
      vulnerable-app:
        build:
          context: .
        ports:
          - 8080:8080
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Wait for container to be ready
        run: |
          sleep 10

      - name: Run exploit
        run: |
          python exploit/upload_malicious_file.py
